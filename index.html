function snapshot(){ const o = {}; for (const k of SYNC_KEYS) o[k] = store.get(k, null); return o }
const b64e = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(s) };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function vaultKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:250000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function seal(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await vaultKey(pass, salt), new TextEncoder().encode(JSON.stringify(obj)));
  return { enc:1, salt:b64e(salt), iv:b64e(iv), ct:b64e(ct) };
}
async function unseal(d, pass){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(d.iv) }, await vaultKey(pass, b64d(d.salt)), b64d(d.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function pushCloud(){
  if (!sb || !sbUser) return;
  setSync('sync');
  try{
    const pass = store.get('vaultPass', '');
    let data = snapshot(); if (pass) data = await seal(data, pass);
    const now = new Date().toISOString();
    const { error } = await sb.from('agora_state').upsert({ user_id: sbUser.id, data, updated_at: now });
    if (error) throw error;
    store.set('lastSync', now); setSync('ok');
  }catch(e){ setSync('err', isPermErr(e) ? 'Permissions manquantes sur la table : lance le script de correction ci-dessous.' : (e.message || String(e))) }
}
function mergeState(local, remote){
  const fresh = !(local.convs?.length) && !Object.keys(local.keys || {}).length;
  const out = { ...local };
  for (const k of SYNC_KEYS) if (fresh || local[k] == null) out[k] = remote[k] ?? local[k];
  const byId = new Map();
  for (const c of [...(remote.convs || []), ...(local.convs || [])]){ const o = byId.get(c.id); if (!o || (c.messages?.length || 0) >= (o.messages?.length || 0)) byId.set(c.id, c) }
  out.convs = [...byId.values()].sort((a, b) => parseInt(b.id, 36) - parseInt(a.id, 36));
  const pj = new Map(); for (const p of [...(remote.projects || []), ...(local.projects || [])]) pj.set(p.id, p); out.projects = [...pj.values()];
  out.keys = { ...(remote.keys || {}), ...(local.keys || {}) };
  const u = { days:{}, rtkSaved: Math.max(local.usage?.rtkSaved || 0, remote.usage?.rtkSaved || 0) };
  for (const src of [remote.usage, local.usage]) for (const [d, day] of Object.entries(src?.days || {})) for (const [p, ms] of Object.entries(day)) for (const [m, v] of Object.entries(ms)){
    const t = ((u.days[d] ||= {})[p] ||= {})[m] ||= { in:0, out:0, req:0, est:0 };
    t.in = Math.max(t.in, v.in); t.out = Math.max(t.out, v.out); t.req = Math.max(t.req, v.req); t.est = Math.max(t.est, v.est || 0);
  }
  out.usage = u;
  return out;
}
async function pullCloud(){
  if (!sb || !sbUser) return;
  setSync('sync');
  const { data: row, error } = await sb.from('agora_state').select('data,updated_at').eq('user_id', sbUser.id).maybeSingle();
  if (error){ setSync('err', isPermErr(error) ? 'Permissions manquantes sur la table : lance le script de correction ci-dessous.' : /agora_state/.test(error.message) ? 'Table agora_state introuvable : lance le script SQL du guide.' : error.message); return }
  if (!row){ return pushCloud() }
  let data = row.data;
  if (data?.enc){
    const pass = store.get('vaultPass', '');
    if (!pass){ setSync('locked', 'Tes données sont chiffrées : entre ta phrase secrète.'); openSettings('compte'); return }
    try{ data = await unseal(data, pass) }catch{ setSync('locked', 'Phrase secrète incorrecte.'); return }
  }
  const last = store.get('lastSync', null);
  if (last && new Date(row.updated_at) <= new Date(last)) return pushCloud();
  const merged = mergeState(snapshot(), data);
  for (const k of SYNC_KEYS) try{ localStorage.setItem(LS + '.' + k, JSON.stringify(merged[k])) }catch{}
  store.set('lastSync', row.updated_at);
  await pushCloud();
  if (sessionStorage.getItem('agora.reloaded') !== row.updated_at){ sessionStorage.setItem('agora.reloaded', row.updated_at); location.reload() }
}

    act.innerHTML = `<button class="btn sm" data-x="proj">Choisir un dépôt</button><button class="btn sm ghost danger" data-x="un">Délier</button>`;
    act.querySelector('[data-x=proj]').onclick = () => $('.scrim')?._show('projets');
    act.querySelector('[data-x=un]').onclick = () => { unlinkGitHub(); refresh() };
  } else {
    act.innerHTML = `<button class="btn sm prim" data-x="link"><svg class="icon" style="width:14px;height:14px"><use href="#i-link"/></svg>Lier GitHub</button>${sb && sbUser ? '<button class="btn sm" data-x="sso">Via mon compte Agora</button>' : ''}`;
    act.querySelector('[data-x=link]').onclick = () => { window.open(GH_TOKEN_URL, '_blank', 'noopener'); paste.hidden = false; inp.focus(); toast('Sur GitHub : descends en bas, clique « Generate token », copie-le, reviens ici') };
    act.querySelector('[data-x=sso]')?.addEventListener('click', () => { store.set('ghPending', true); signIn('github', { scopes:'repo' }) });
  }
  const go = async () => { const ok = paste.querySelector('[data-x=ok]'); ok.textContent = '…'; try{ const u = await linkGitHub(inp.value); toast('GitHub lié : @' + u.login); refresh() }catch(e){ ok.textContent = 'OK'; toast(e.message) } };
  paste.querySelector('[data-x=ok]').onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go() };
  paste.querySelector('[data-x=clip]').onclick = async () => { try{ inp.value = (await navigator.clipboard.readText()).trim(); go() }catch{ toast('Fais Ctrl+V dans le champ'); inp.focus() } };
  host.append(card);
}

function tabUsage(body){
  const a = aggregate(usageRange);
  const all = aggregate('all');
  const max = Math.max(1, ...Object.values(a.per).map(v => v.in + v.out));
  const rows = Object.entries(a.per).sort((x, y) => (y[1].in + y[1].out) - (x[1].in + x[1].out));
  body.innerHTML = `<h3>Tokens par IA</h3><p class="sub">Compté à partir des chiffres renvoyés par chaque fournisseur. Quand un fournisseur ne les donne pas, Agora estime (marqué ≈).</p>
    <div class="tabs" style="margin-bottom:14px">${[['today','Aujourd\'hui'],['7d','7 jours'],['all','Total']].map(([k, n]) => `<button class="${k === usageRange ? 'on' : ''}" data-r="${k}">${n}</button>`).join('')}</div>
    <div class="stats">
      <div class="stat"><small>Total</small><b class="num">${fmt(a.tin + a.tout)}</b><span class="num">${fmtFull(a.tin + a.tout)} tokens</span></div>
      <div class="stat"><small>Entrée (tes messages + contexte)</small><b class="num">${fmt(a.tin)}</b><span>↑ envoyés</span></div>
      <div class="stat"><small>Sortie (réponses)</small><b class="num">${fmt(a.tout)}</b><span>↓ reçus</span></div>
      <div class="stat"><small>Requêtes</small><b class="num">${fmtFull(a.req)}</b><span>${Object.keys(a.per).length} IA utilisées</span></div>
      ${usage.rtkSaved ? `<div class="stat"><small>Économisés par RTK</small><b class="num">${fmt(usage.rtkSaved)}</b><span>depuis le début</span></div>` : ''}
    </div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Entrée</span><span><i style="background:color-mix(in srgb,var(--accent) 45%,var(--panel))"></i>Sortie</span></div>
    <div class="list" id="ulist"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn ghost danger" id="resetU">Réinitialiser les compteurs</button></div>`;
  const list = body.querySelector('#ulist');
  if (!rows.length) list.innerHTML = '<div class="item"><div class="txt"><small>Aucun token sur cette période. Envoie un message pour commencer.</small></div></div>';
  for (const [pid, v] of rows){
    const p = prov(pid) || { name:pid, color:'#888' };
    const r = document.createElement('div'); r.className = 'urow';
    r.innerHTML = `<div class="nm">${p.id ? logoTile(p, 20) : `<span class="dot" style="background:${p.color}"></span>`}<span>${esc(p.name)}</span></div>
      <div class="bar" title="${fmtFull(v.in)} entrée · ${fmtFull(v.out)} sortie"><i style="width:${v.in / max * 100}%;background:var(--accent)"></i><i style="width:${v.out / max * 100}%;background:color-mix(in srgb,var(--accent) 45%,var(--panel))"></i></div>
      <div class="v num">↑ ${fmt(v.in)} · ↓ ${fmt(v.out)} · ${v.req} req.</div>
      <div class="umodels">${Object.entries(v.models).sort((x, y) => (y[1].in + y[1].out) - (x[1].in + x[1].out)).map(([m, mv]) => `<div><span>${esc(m)}</span><span class="num">${fmt(mv.in + mv.out)}</span></div>`).join('')}</div>`;
    list.append(r);
  }
  body.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { usageRange = b.dataset.r; tabUsage(body) });
  body.querySelector('#resetU').onclick = e => {
    if (e.target.dataset.c){ usage = { days:{}, rtkSaved:0 }; store.set('usage', usage); renderSideMeta(); tabUsage(body); toast('Compteurs remis à zéro') }
    else { e.target.dataset.c = 1; e.target.textContent = `Confirmer (${fmt(all.tin + all.tout)} tokens effacés)` }
  };
}

function tabCodes(body){
  tabCodesBase(body);

  sec.innerHTML = `<h4>Mes codes</h4><p class="sub" style="margin-bottom:10px">Crée tes propres raccourcis. Dans le modèle, <code style="font-family:var(--f-mono);color:var(--accent)">{x}</code> est remplacé par ce que tu tapes après la commande.</p>

    <div class="form"><label>Commande<input id="cCmd" placeholder="patchnote"></label><label>Description<input id="cDesc" placeholder="Patch note pour Discord"></label>
    <label class="full">Modèle de prompt<textarea id="cTpl" rows="3" placeholder="Écris une patch note Discord à partir de ces changements : {x}"></textarea></label></div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn prim" id="cAdd">Ajouter le code</button></div>`;
  body.insertBefore(sec, body.querySelector('h3').nextSibling.nextSibling);
  const draw = () => {
    const l = sec.querySelector('#myList'); l.innerHTML = myCodes.length ? '' : '<div class="item"><div class="txt"><small>Aucun code perso pour l\'instant.</small></div></div>';
    myCodes.forEach((c, i) => { const it = document.createElement('div'); it.className = 'item'; it.innerHTML = `<div class="txt"><b><code>/${esc(c.cmd)}</code> ${esc(c.name)}</b><small>${esc(c.tpl.slice(0, 120))}</small></div><button class="btn sm ghost danger">Supprimer</button>`;
      it.querySelector('button').onclick = () => { myCodes.splice(i, 1); store.set('myCodes', myCodes); draw() }; l.append(it) });
  };
  draw();
  sec.querySelector('#cAdd').onclick = () => {
    const cmd = sec.querySelector('#cCmd').value.trim().replace(/^\//, '').toLowerCase().replace(/[^a-z0-9-]/g, ''), desc = sec.querySelector('#cDesc').value.trim();
    let tpl = sec.querySelector('#cTpl').value.trim();

    sec.querySelectorAll('input,textarea').forEach(x => x.value = ''); draw(); toast(`/${cmd} ajouté`);

function tabCodesBase(body){
  body.innerHTML = `<h3>Codes secrets</h3><p class="sub">Tape <code style="font-family:var(--f-mono);color:var(--accent)">/</code> dans le chat pour voir la liste, puis ton sujet. Ex. <code style="font-family:var(--f-mono);color:var(--accent)">/premortem lancement de mon serveur</code>. Sans sujet, le code s'applique à la conversation en cours.</p>
    <div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn sm" id="allOn">Tout activer</button><button class="btn sm ghost" id="allOff">Tout désactiver</button></div><div class="list"></div>`;
  const list = body.querySelector('.list');
  for (const c of CODES){
    const it = document.createElement('div'); it.className = 'item';
    it.innerHTML = `<div class="txt"><b><code>/${esc(c.cmd)}</code> ${esc(c.name)} ${c.code ? '<span class="pill">Code</span>' : ''}${c.needs ? `<span class="pill">plugin ${esc(c.needs)}</span>` : ''}</b><small>${esc(c.desc)}</small></div>${switchHtml('cd-' + c.cmd, !codesOff.has(c.cmd))}`;
    it.querySelector('input').onchange = e => { e.target.checked ? codesOff.delete(c.cmd) : codesOff.add(c.cmd); store.set('codesOff', [...codesOff]) };
    list.append(it);
  }
  body.querySelector('#allOn').onclick = () => { codesOff.clear(); store.set('codesOff', []); tabCodes(body) };
  body.querySelector('#allOff').onclick = () => { CODES.forEach(c => codesOff.add(c.cmd)); store.set('codesOff', [...codesOff]); tabCodes(body) };
}

function importConversations(data){
  const list = Array.isArray(data) ? data : data.conversations || data.data || [data];
  const out = [];
  for (const cv0 of list){
    let msgs = [], title = cv0.title || cv0.name || 'Conversation importée';
    if (cv0.mapping){ // export ChatGPT
      let node = cv0.current_node; const chain = [];
      while (node && cv0.mapping[node]){ chain.unshift(cv0.mapping[node]); node = cv0.mapping[node].parent }
      for (const n of chain){ const m = n.message; if (!m || !m.content) continue; const role = m.author?.role; if (role !== 'user' && role !== 'assistant') continue;
        const text = (m.content.parts || []).filter(x => typeof x === 'string').join('\n').trim(); if (text) msgs.push({ role, content:text, ...(role === 'assistant' ? { model:'Import ChatGPT' } : {}) }) }
    } else if (Array.isArray(cv0.messages)){ // LibreChat ou Agora
      for (const m of cv0.messages){
        const role = m.role || (m.isCreatedByUser || m.sender === 'User' ? 'user' : 'assistant');
        const text = typeof m.content === 'string' ? m.content : (m.text || (Array.isArray(m.content) ? m.content.map(x => x.text || x.think || '').join('\n') : ''));
        if (text || m.images) msgs.push({ ...m, role, content:text, ...(role === 'assistant' && !m.model ? { model: m.sender || m.endpoint || 'Import LibreChat' } : {}) });
      }
    }
    if (!msgs.length) continue;
    const id = cv0.id && !convs.some(c => c.id === cv0.id) ? cv0.id : (Date.now() + out.length).toString(36);
    out.push({ id, title: String(title).slice(0, 60), messages: msgs });
  }
  convs = [...out, ...convs]; saveConvs(); renderConvList();
  return out.length;
}

      const issueBody = `${text}\n\n${contact ? `**Contact :** ${contact}\n\n` : ''}${meta ? '<details><summary>Infos techniques</summary>\n\n```json\n' + JSON.stringify(meta, null, 2) + '\n```\n</details>' : ''}`;
      url = `${gl.replace(/\/$/, '')}/issues/new?title=${encodeURIComponent(`[${kindLabel}] ${title}`)}&body=${encodeURIComponent(issueBody)}&labels=${encodeURIComponent(kind === 'bug' ? 'bug' : 'suggestion')}`;
      window.open(url, '_blank', 'noopener'); via = 'ouverte sur GitHub (valide-la sur la page qui s\'est ouverte)';
    }
    if (!via){ copy(`[${kindLabel}] ${title}\n\n${text}${contact ? '\n\nContact : ' + contact : ''}`, null); via = 'copiée (aucune boîte de réception configurée)' }
    sent.unshift({ title, kindLabel, at: Date.now(), via, url }); store.set('sentSuggestions', sent.slice(0, 30));
    toast('Suggestion ' + via + '. Merci !'); tabSuggestion(body);
  };
}

function tabGeneral(body){
  body.innerHTML = `<h3>Général</h3><p class="sub">Réglages appliqués à toutes les conversations.</p>
    <div class="list" style="margin-bottom:16px"><div class="item"><div class="txt"><b>Mode expert</b><small>Affiche tous les fournisseurs, les identifiants exacts des modèles et des fournisseurs avancés (Cerebras, Ollama). En mode normal, tu choisis juste Polyvalent, Rapide, Code, Réflexion ou Images.</small></div>${switchHtml('gExpert', !!settings.expert)}</div></div>
    <div class="form">
      <label class="full">Instructions personnalisées<textarea id="gSys" rows="4" placeholder="Ex. Je m'appelle Robin, je préfère des réponses directes en français.">${esc(settings.system)}</textarea></label>
      <label>Créativité (température) : <span id="gTv" class="num">${settings.temperature}</span><input type="range" id="gTemp" min="0" max="1.5" step="0.1" value="${settings.temperature}" style="accent-color:var(--accent);padding:0"></label>
      <label>Longueur max des réponses (tokens)<input id="gMax" type="number" min="256" max="64000" step="256" value="${settings.maxTokens}"></label>
    </div>
    <h4>Panneau Aperçu / Code</h4>
    <div class="list"><div class="item"><div class="txt"><b>Ouvrir le panneau automatiquement</b><small>Quand l'IA écrit du code, il s'affiche à droite en direct, puis passe en aperçu si c'est une page web.</small></div>${switchHtml('gCanvas', settings.autoCanvas)}</div></div>
    <h4>Lecteur de documentation</h4>
    <div class="form">
      <label>Service de lecture<input id="gReader" value="${esc(settings.docReader)}" placeholder="https://r.jina.ai/"></label>
      <label>Clé Jina (facultatif, plus de requêtes)<input id="gJina" type="password" value="${esc(settings.jinaKey)}" placeholder="jina_…" autocomplete="off"></label>
      <small class="full" style="color:var(--faint);font-size:12px;margin-top:-4px">Les navigateurs ne peuvent pas lire directement les sites de documentation. Agora passe par ce service qui convertit les pages en texte. Gratuit sans clé, avec une limite de débit.</small>
    </div>
    <h4>Données</h4>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="gExport">Exporter les conversations</button>${plug('librechat') ? '<button class="btn" id="gImport">Importer (LibreChat, ChatGPT, Agora)</button><input type="file" id="gImpFile" accept=".json,application/json" hidden>' : ''}<button class="btn ghost danger" id="gClear">Effacer l'historique</button></div>
    <div style="display:flex;justify-content:flex-end;margin-top:22px"><button class="btn prim" id="gSave">Enregistrer</button></div>`;
  body.querySelector('#gTemp').oninput = e => body.querySelector('#gTv').textContent = e.target.value;
  body.querySelector('#gExpert').onchange = e => { settings.expert = e.target.checked; store.set('settings', settings); if (!settings.expert && current.provider !== 'smart'){ current = { provider:'smart', model:'smart-balanced' }; store.set('current', current) } renderModelLbl(); toast(settings.expert ? 'Mode expert activé' : 'Mode normal') };
  body.querySelector('#gSave').onclick = () => {
    let reader = body.querySelector('#gReader').value.trim() || 'https://r.jina.ai/'; if (!reader.endsWith('/')) reader += '/';
    settings = { ...settings, system: body.querySelector('#gSys').value, temperature: +body.querySelector('#gTemp').value, maxTokens: +body.querySelector('#gMax').value || 4096,
      autoCanvas: body.querySelector('#gCanvas').checked, docReader: reader, jinaKey: body.querySelector('#gJina').value.trim() };
    store.set('settings', settings); updateComposer(); toast('Enregistré');
  };
  body.querySelector('#gExport').onclick = () => download('agora-conversations.json', JSON.stringify(convs, null, 2));
  body.querySelector('#gImport')?.addEventListener('click', () => body.querySelector('#gImpFile').click());
  body.querySelector('#gImpFile')?.addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try{ const n = importConversations(JSON.parse(await f.text())); toast(n ? `${n} conversation${n > 1 ? 's' : ''} importée${n > 1 ? 's' : ''}` : 'Aucune conversation reconnue dans ce fichier') }
    catch(err){ toast('Fichier illisible : ' + err.message) }
    e.target.value = '';
  });
  body.querySelector('#gClear').onclick = e => {
    if (e.target.dataset.c){ convs = []; activeId = null; saveConvs(); renderConvList(); renderMessages(); toast('Historique effacé'); e.target.textContent = 'Effacer l\'historique'; delete e.target.dataset.c }
    else { e.target.dataset.c = 1; e.target.textContent = `Confirmer (${convs.length} conversations)` }
  };
}

initCloud();
finishOpenRouterLogin();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
['openrouter','pollinations'].forEach(id => refreshModels(prov(id), true));
