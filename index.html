<style>
/* Layout : sidebar à gauche + colonne de conversation centrée (~760px), composer en bas, réglages en modal à onglets */
:root{
  --bg:#17181b; --panel:#1e1f23; --raise:#26282d; --line:#33353b;
  --fg:#ecebe8; --muted:#9a9ba1; --faint:#6c6e75;
  --accent:#7cc4b8; --accent-ink:#0f1f1c; --danger:#e07a6f; --warn:#d9b26a;
  --f-display:"Fraunces", Georgia, serif;
  --f-body:"Figtree", system-ui, -apple-system, Segoe UI, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f6f6f4; --panel:#ecece9; --raise:#ffffff; --line:#d9d9d4;
    --fg:#1d1e21; --muted:#5f6067; --faint:#8b8c92; --accent:#2f8577; --accent-ink:#ffffff; --danger:#b94a3f; --warn:#9a6b12; color-scheme:light; }
}
:root[data-theme="light"]{ --bg:#f6f6f4; --panel:#ecece9; --raise:#ffffff; --line:#d9d9d4;
  --fg:#1d1e21; --muted:#5f6067; --faint:#8b8c92; --accent:#2f8577; --accent-ink:#ffffff; --danger:#b94a3f; --warn:#9a6b12; color-scheme:light; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--fg)}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
canvas.orb{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

/* Sidebar */
aside{width:272px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:4px;transition:margin .2s}
aside.closed{margin-left:-272px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 10px}
.brand b{font:500 22px/1 var(--f-display);letter-spacing:-.01em}
.brand .tog{margin-left:auto}
.side-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;color:var(--fg)}
.side-btn:hover{background:var(--raise)}
.side-btn.primary{background:var(--raise);border:1px solid var(--line);margin-bottom:4px}
.side-btn .meta{margin-left:auto;font-size:11.5px;color:var(--faint);font-family:var(--f-mono)}
.side-label{font-size:12px;color:var(--faint);padding:14px 10px 4px;letter-spacing:.04em}
#convList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;min-height:0}
.conv{display:flex;align-items:center;border-radius:8px;padding:7px 10px;gap:6px;cursor:pointer;font-size:14px}
.conv span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv:hover,.conv.active{background:var(--raise)}
.conv .del{opacity:0;color:var(--faint);display:flex}
.conv:hover .del{opacity:1}
.conv .del:hover{color:var(--danger)}
.side-proj{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}

/* Main */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:52px}
#openSide{display:none}
aside.closed ~ main #openSide{display:flex}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;color:var(--muted)}
.iconbtn:hover{background:var(--raise);color:var(--fg)}
.topbar .badges{display:flex;gap:6px;flex-wrap:wrap}

#scroller{flex:1;overflow-y:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.col{max-width:var(--colw,760px);margin:0 auto;width:100%}
#messages{display:flex;flex-direction:column;gap:26px}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:6px;text-align:center}
.empty .orbwrap{margin-bottom:10px}
.empty h1{font:400 clamp(30px,5vw,42px)/1.1 var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance}
.empty h1 em{font-style:normal;color:var(--accent)}
.empty p{color:var(--muted);margin:6px 0 0}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.suggest button{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted)}
.suggest button:hover{color:var(--fg);background:var(--raise)}
.suggest button code{font-family:var(--f-mono);color:var(--accent);font-size:12px}

.msg.user{align-self:flex-end;max-width:85%;background:var(--raise);border:1px solid var(--line);padding:10px 16px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user .cmd{display:inline-block;font-family:var(--f-mono);font-size:12px;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:1px 7px;border-radius:6px;margin-right:6px}
.msg.ai{min-width:0}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);margin-bottom:6px;font-family:var(--f-mono);flex-wrap:wrap}
.who .st{color:var(--accent)}
.md{overflow-wrap:anywhere}
.md p{margin:0 0 .8em}.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{font-family:var(--f-display);font-weight:500;line-height:1.25;margin:1.1em 0 .4em}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--raise);padding:1px 5px;border-radius:4px}
.md pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:34px 14px 12px;overflow-x:auto;position:relative}
.md pre code{background:none;padding:0;font-size:13px;line-height:1.55}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 10px}
.md a{color:var(--accent)}
.md blockquote{margin:0;padding-left:14px;border-left:3px solid var(--line);color:var(--muted)}
.md .mermaid{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;text-align:center}
.codebar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:4px;padding:5px 6px 5px 12px;font-size:11px;font-family:var(--f-mono);color:var(--faint);border-bottom:1px solid var(--line)}
.codebar span{margin-right:auto}
.codebar button{padding:2px 8px;border-radius:5px;color:var(--muted)}
.codebar button:hover{background:var(--raise);color:var(--fg)}
details.think{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--muted);font-size:13.5px}
details.think summary{cursor:pointer;font-family:var(--f-mono);font-size:12px}
details.think div{white-space:pre-wrap;margin-top:6px;max-height:300px;overflow-y:auto}
.actions{display:flex;gap:2px;margin-top:6px;align-items:center;flex-wrap:wrap}
.actions button{font-size:12px;padding:3px 8px;border-radius:6px;color:var(--faint);display:inline-flex;align-items:center;gap:5px}
.actions button:hover{background:var(--raise);color:var(--fg)}
.actions .icon{width:14px;height:14px}
.actions .tok{margin-left:auto;font-size:11.5px;font-family:var(--f-mono);color:var(--faint)}
.err{color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);background:color-mix(in srgb,var(--danger) 8%,transparent);padding:10px 14px;border-radius:10px;font-size:14px}
.route-note{font-size:12px;color:var(--warn);font-family:var(--f-mono);margin-bottom:6px}
.genimg{max-width:min(512px,100%);border-radius:12px;border:1px solid var(--line);display:block;background:var(--panel);aspect-ratio:1;object-fit:cover}
.genimg-wait{width:min(512px,100%);aspect-ratio:1;border-radius:12px;border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px}

/* Composer */
.composer-wrap{padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.composer{background:var(--raise);border:1px solid var(--line);border-radius:18px;padding:12px 12px 10px 16px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.composer.coding{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.composer textarea{width:100%;border:0;background:none;resize:none;outline:none;max-height:220px;min-height:26px;line-height:1.5}
.composer-row{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted);max-width:100%}
.chip:hover{color:var(--fg);background:var(--panel)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.chip .icon{width:15px;height:15px}
.chip .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
#ctxTok{margin-left:auto;font-size:11.5px;color:var(--faint);font-family:var(--f-mono)}
#send{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center}
#send:disabled{opacity:.35;cursor:default}
#mic{width:34px;height:34px}
#mic.rec{color:var(--accent)}
#activeTags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#activeTags:empty{display:none}
.tag{font-size:12px;font-family:var(--f-mono);padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.tag.plug{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.tag button{color:inherit;opacity:.7;padding:0 2px}
.foot{text-align:center;font-size:11.5px;color:var(--faint);margin-top:8px}

/* Popovers */
.pop{position:absolute;bottom:calc(100% + 8px);left:0;width:min(460px,calc(100vw - 32px));max-height:min(540px,70vh);background:var(--raise);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;z-index:20;overflow:hidden}
.pop-head{padding:12px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pop input[type=search]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;align-items:center}
.tabs button{font-size:12.5px;padding:4px 10px;border-radius:999px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.tabs label{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center;white-space:nowrap;padding-left:8px}
.pop-body{overflow-y:auto;padding:6px}
.grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 8px 4px;display:flex;gap:8px;align-items:center}
.grp .warn{text-transform:none;letter-spacing:0;color:var(--danger);font-size:11px;margin-left:auto}
.grp .dot{width:8px;height:8px;border-radius:50%}
.model{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;font-size:13.5px}
.model:hover,.model.kb{background:var(--panel)}
.model.sel{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.model .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);font-size:12.5px}
.model small{color:var(--muted);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);flex:none}
.cat.free{border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--accent)}
.modes-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:10px}
.mode b{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;width:100%}
.mode small{color:var(--muted);font-size:12px;line-height:1.35}
.mode.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.mode.on b::after{content:"activé";margin-left:auto;font-size:10px;font-family:var(--f-mono);color:var(--accent)}
.pop-sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 12px 0}

/* Modal réglages */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--raise);border:1px solid var(--line);border-radius:16px;width:min(900px,100%);height:min(680px,90vh);display:flex;overflow:hidden}
.mnav{width:200px;flex:none;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.mnav h2{font:500 20px/1.2 var(--f-display);margin:0 10px 12px}
.mnav button{text-align:left;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.mnav button:hover{color:var(--fg);background:var(--raise)}
.mnav button.on{background:var(--raise);color:var(--fg);font-weight:500}
.mnav .close{margin-top:auto}
.mbody{flex:1;overflow-y:auto;padding:22px 24px;min-width:0}
.mbody h3{font:500 22px/1.2 var(--f-display);margin:0 0 4px}
.mbody .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px;max-width:62ch}
.mbody h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:500;margin:22px 0 8px}

.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.acc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.acc.linked{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.acc-top{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:600 15px/1 var(--f-body);color:#fff;flex:none}
.acc-top b{font-weight:600;display:block;line-height:1.2}
.acc-top small{color:var(--faint);font-size:12px}
.acc-top .tier{margin-left:auto}
.tier{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tier.gratuit{border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--accent)}
.tier.payant{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.acc p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.acc .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.acc .row input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:12.5px var(--f-mono);outline:none}
.acc .linked-info{font-size:12px;color:var(--accent);font-family:var(--f-mono)}
.btn{padding:7px 13px;border-radius:8px;border:1px solid var(--line);font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--panel)}
.btn.acc-btn,.btn.prim{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.prim:hover,.btn.acc-btn:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.magic{display:flex;gap:8px;padding:12px;border:1px dashed var(--line);border-radius:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.magic input{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px var(--f-mono);outline:none}
.magic span{font-size:13px;color:var(--muted);width:100%}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);background:var(--bg)}
.item:first-child{border-top:0}
.item .txt{flex:1;min-width:0}
.item .txt b{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .txt small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.item code{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.pill{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--fg);top:3px;left:3px;transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(16px);background:var(--accent-ink)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.stat small{color:var(--muted);font-size:12px;display:block}
.stat b{font:500 26px/1.2 var(--f-display);display:block;margin-top:2px}
.stat span{font-size:11.5px;color:var(--faint);font-family:var(--f-mono)}
.urow{display:grid;grid-template-columns:minmax(110px,160px) 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg)}
.urow:first-child{border-top:0}
.urow .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;min-width:0}
.urow .nm .dot{width:9px;height:9px;border-radius:50%;flex:none}
.bar{height:8px;border-radius:999px;background:var(--panel);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.urow .v{font:12px var(--f-mono);color:var(--muted);text-align:right;white-space:nowrap}
.umodels{grid-column:1/-1;display:flex;flex-direction:column;gap:3px;padding-left:17px}
.umodels div{display:flex;justify-content:space-between;gap:10px;font:11.5px var(--f-mono);color:var(--faint)}
.umodels div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea,.mbody textarea.big{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;width:100%}
.plat-grid{display:flex;flex-wrap:wrap;gap:6px}
.plat{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);background:var(--bg)}
.plat:hover{color:var(--fg)}
.plat.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.projs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.proj-chip{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;text-align:left;background:var(--bg)}
.proj-chip small{display:block;color:var(--faint);font-size:11.5px}
.proj-chip.on{border-color:var(--accent)}

/* Couleurs syntaxe (highlight.js) */
:root{ --syn-kw:#c792ea; --syn-str:#a5d6a7; --syn-num:#f2b880; --syn-com:#6c7480; --syn-fn:#82b1ff; --syn-type:#7cc4b8; --syn-attr:#ffcb8b; }
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --syn-kw:#8a3fb8; --syn-str:#2e7d32; --syn-num:#b35900; --syn-com:#8b8f96; --syn-fn:#1f5fbf; --syn-type:#1e7a6b; --syn-attr:#9a5b00; } }
:root[data-theme="light"]{ --syn-kw:#8a3fb8; --syn-str:#2e7d32; --syn-num:#b35900; --syn-com:#8b8f96; --syn-fn:#1f5fbf; --syn-type:#1e7a6b; --syn-attr:#9a5b00; }
.hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-literal{color:var(--syn-kw)}
.hljs-string,.hljs-regexp,.hljs-symbol{color:var(--syn-str)}
.hljs-number{color:var(--syn-num)}
.hljs-comment,.hljs-quote,.hljs-meta{color:var(--syn-com);font-style:italic}
.hljs-title,.hljs-function .hljs-title,.hljs-title.function_{color:var(--syn-fn)}
.hljs-type,.hljs-class .hljs-title,.hljs-title.class_,.hljs-tag,.hljs-name{color:var(--syn-type)}
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-params,.hljs-property{color:var(--syn-attr)}

/* Docs consultées + carte "ouvrir dans le panneau" */
.docs-used{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--faint);margin-bottom:8px}
.docs-used a{color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;text-decoration:none;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docs-used a:hover{color:var(--accent);border-color:var(--accent)}
.cvcard{display:flex;align-items:center;gap:12px;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);width:100%;max-width:440px;text-align:left}
.cvcard:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.cvcard .ic{width:36px;height:36px;border-radius:9px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.cvcard b{display:block;font-weight:600;font-size:14px}
.cvcard small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.cvcard .go{margin-left:auto;font-size:12.5px;color:var(--muted);flex:none}
.doc-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:12px;color:var(--faint);align-items:center}
.doc-chips a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--line)}
.doc-chips a:hover{color:var(--accent)}

/* Panneau latéral Aperçu / Code */
#canvas{width:var(--cvw,46%);min-width:340px;max-width:75vw;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;position:relative;min-height:0}
.cv-resize{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5}
.cv-resize:hover,.cv-resize.drag{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.cv-head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);min-height:52px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}
.seg button{padding:4px 10px;border-radius:7px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.seg button.on{background:var(--raise);color:var(--fg)}
.seg button:disabled{opacity:.35;cursor:default}
.cv-title{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
.cv-title small{color:var(--faint);font-weight:400;font-family:var(--f-mono);font-size:12px;margin-left:6px}
.cv-files{display:flex;gap:2px;padding:6px 10px 0;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.cv-files:empty{display:none}
.cv-files button{font:12px var(--f-mono);padding:6px 10px;border-radius:7px 7px 0 0;color:var(--muted);white-space:nowrap;border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.cv-files button.on{color:var(--fg);background:var(--bg);border-color:var(--line)}
.cv-body{flex:1;min-height:0;position:relative;background:var(--bg)}
.cv-body iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.cv-code{position:absolute;inset:0;overflow:auto;display:flex;font:12.5px/1.6 var(--f-mono)}
.cv-code pre{margin:0;padding:14px 0}
.cv-code .gutter{padding:14px 10px 14px 14px;text-align:right;color:var(--faint);user-select:none;position:sticky;left:0;background:var(--bg);border-right:1px solid var(--line);min-width:44px}
.cv-code .src{padding-left:14px;padding-right:20px;flex:1}
.cv-code textarea{position:absolute;inset:0;width:100%;height:100%;border:0;outline:none;resize:none;background:var(--bg);color:var(--fg);font:12.5px/1.6 var(--f-mono);padding:14px 18px;tab-size:4}
.cv-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13.5px;text-align:center;padding:20px}
.cv-console{border-top:1px solid var(--line);max-height:140px;overflow-y:auto;font:12px/1.5 var(--f-mono);padding:6px 12px;background:var(--panel)}
.cv-console div{white-space:pre-wrap;overflow-wrap:anywhere}
.cv-console .error{color:var(--danger)}.cv-console .warn{color:var(--warn)}
.cv-console-head{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.cv-live{font-size:11px;font-family:var(--f-mono);color:var(--accent);display:inline-flex;gap:6px;align-items:center}
@media (max-width:900px){
  #canvas{position:fixed;inset:0;width:100%!important;max-width:none;min-width:0;z-index:45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .cv-resize{display:none}
}
.doc-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);background:var(--bg);font-size:13.5px}
.doc-row:first-child{border-top:0}
.doc-row .txt{flex:1;min-width:0}
.doc-row a{color:var(--muted);font:11.5px var(--f-mono);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.doc-row a:hover{color:var(--accent)}
.pill.ok{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill.bad{color:var(--danger)}

/* Fond décoratif (Design) */
#bgLayer{position:fixed;inset:0;pointer-events:none;z-index:0}
body > aside, body > main, body > #canvas{position:relative;z-index:1}
main{background:transparent}

/* Mode de permission */
.perm{font-family:var(--f-mono);font-size:12px}
.perm.auto{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));color:var(--warn)}
.perm.plan{border-color:color-mix(in srgb,#8fa8ff 55%,var(--line));color:#8fa8ff}
.perm-pop .mode b::after{display:none}
.perm-pop kbd{font:11px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--faint)}

/* Carte d'approbation + journal d'actions */
.approve{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 6%,var(--bg));border-radius:12px;padding:12px 14px;margin:10px 0;display:flex;flex-direction:column;gap:8px;max-width:560px}
.approve b{font-weight:600;font-size:14px}
.approve ul{margin:0;padding-left:18px;font:12.5px/1.55 var(--f-mono);color:var(--muted);max-height:160px;overflow-y:auto}
.approve .row{display:flex;gap:6px;flex-wrap:wrap}
.approve.done{border-color:var(--line);background:transparent;padding:6px 10px;flex-direction:row;align-items:center;font-size:12.5px;color:var(--muted)}
.approve.done b{font-weight:500;font-size:12.5px}
.actlog{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.actlog a,.actlog span{font:12px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:2px 8px;text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.actlog a:hover{color:var(--accent);border-color:var(--accent)}
.actlog .ok{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.msg.sys{align-self:flex-start;font:12px var(--f-mono);color:var(--faint);display:flex;gap:6px;align-items:center;border:1px dashed var(--line);border-radius:8px;padding:4px 10px}
.planbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* Compte (bas de sidebar) */
.acct{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:10px;margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.acct:hover{background:var(--raise)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.acct .who2{flex:1;min-width:0;text-align:left;line-height:1.25}
.acct .who2 b{font-weight:500;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .who2 small{color:var(--faint);font-size:11.5px}
.sso{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sso button{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:14px}
.sso button:hover{border-color:var(--accent)}
.sso .logo{width:24px;height:24px;border-radius:6px;font-size:12px}
.profile{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:14px}
.profile .avatar{width:48px;height:48px;font-size:18px}
.profile b{font-size:16px;font-weight:600;display:block}
.profile small{color:var(--muted)}
.codebox{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:12px/1.55 var(--f-mono);white-space:pre;overflow-x:auto;max-height:260px}
.codebox .btn{position:absolute;top:8px;right:8px}
ol.steps{padding-left:20px;margin:0 0 12px;font-size:13.5px;line-height:1.6;color:var(--muted)}
ol.steps b{color:var(--fg);font-weight:500}

/* Design */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.swatch{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;background:var(--bg);display:flex;flex-direction:column;gap:6px;font-size:13px}
.swatch.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.swatch .pv{height:44px;border-radius:8px;display:flex;align-items:flex-end;padding:6px;gap:4px}
.swatch .pv i{display:block;height:8px;border-radius:4px}
.drow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.drow:first-of-type{border-top:0}
.drow > span{flex:1;min-width:160px;font-size:14px}
.drow > span small{display:block;color:var(--muted);font-size:12px}
.drow input[type=color]{width:42px;height:32px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.drow input[type=range]{width:180px;accent-color:var(--accent)}
.drow select,.drow input[type=url]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none;min-width:180px}

/* Mode simple : choix par besoin */
.model.smart{padding:9px 8px;align-items:center}
.model.smart b{font-weight:600;font-size:14px}
.model.smart small{color:var(--muted);font-size:12px;white-space:normal}
.sic{width:32px;height:32px;border-radius:9px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.model.smart .cat{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Pièces jointes */
#attachRow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
#attachRow:empty{display:none}
.achip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px;color:var(--muted);background:var(--panel);max-width:240px}
.achip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.achip.big{padding:4px 6px 4px 4px}
.achip img{width:34px;height:34px;object-fit:cover;border-radius:6px}
.achip button{color:var(--faint);padding:0 4px;font-size:15px}
.achip button:hover{color:var(--danger)}
main.dropping::after{content:"Dépose tes fichiers ici";position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:16px;background:color-mix(in srgb,var(--bg) 80%,transparent);display:flex;align-items:center;justify-content:center;font:500 18px var(--f-display);color:var(--accent);z-index:30;pointer-events:none}
.uwrap{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:85%}
.uwrap .msg.user{max-width:100%}
.uatt{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.uatt img{max-width:200px;max-height:160px;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;object-fit:cover}
.utools{display:flex;gap:2px;align-items:center;opacity:0;transition:opacity .15s;font-size:12px;color:var(--faint)}
.uwrap:hover .utools,.utools:focus-within{opacity:1}
.utools button{padding:2px 7px;border-radius:6px;color:var(--faint);display:inline-flex;align-items:center;gap:4px;font-size:12px}
.utools button:hover:not(:disabled){background:var(--raise);color:var(--fg)}
.utools button:disabled{opacity:.35;cursor:default}
.uedit{width:min(620px,80vw);display:flex;flex-direction:column;gap:6px}
.uedit textarea{width:100%;background:var(--raise);border:1px solid var(--accent);border-radius:14px;padding:10px 14px;outline:none;resize:vertical;min-height:70px}
.uedit .row{display:flex;justify-content:flex-end;gap:6px}
.logbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 8px;margin:-4px -4px 8px;border-radius:10px;background:color-mix(in srgb,var(--accent) 10%,transparent);flex-wrap:wrap}
.logbar svg{color:var(--accent)}
.logbar .btn{margin-left:auto}

/* Comparer */
.cmpgrid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;margin-left:-4px}
.cmpcol{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);min-width:0;display:flex;flex-direction:column;gap:8px}
.cmpcol.kept{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cmphead{display:flex;align-items:center;gap:8px;font:12px var(--f-mono);color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.cmphead b{font-weight:500;color:var(--fg);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmpcol .md{font-size:.95em;flex:1}
.cmpfoot{display:flex;align-items:center;gap:8px;justify-content:space-between;font:11.5px var(--f-mono);color:var(--faint)}
.cmpfoot:empty{display:none}
@media (max-width:900px){.cmpgrid{grid-template-columns:1fr}}

/* Assistants */
.dotc{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
#agentBtn .x{color:var(--faint);margin-left:2px;padding:0 2px}
#agentBtn .x:hover{color:var(--danger)}
.agrow{margin-top:26px;width:100%;max-width:680px}
.agtitle{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.aglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.agcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--raise) 60%,transparent)}
.agcard:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.agcard.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.agcard b{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.agcard small{color:var(--muted);font-size:12px;line-height:1.35}
.agcard .dotc{margin-bottom:4px}
.agcard.add{border-style:dashed}

/* Page Applications */
.pill.dev{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.apps-scrim{align-items:flex-start;overflow-y:auto}
.apps{width:min(1060px,100%);margin:24px auto;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:28px}
.apps-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px}
.apps-head div{flex:1}
.apps-head h2{font:400 clamp(28px,4vw,40px)/1.1 var(--f-display);margin:0;letter-spacing:-.015em}
.apps-head p{color:var(--muted);margin:8px 0 0;max-width:60ch}
.apps-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.appcard{border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--panel);display:flex;flex-direction:column;gap:10px;overflow:hidden;position:relative;min-height:340px}
.apptop{display:flex;align-items:center;gap:10px}
.apptop h3{margin:0;font-weight:600;font-size:17px;flex:1}
.appcard > p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.approws{display:flex;flex-direction:column}
.approw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.approw:first-child{border-top:0}
.approw span{display:flex;align-items:center;gap:9px}
.approw .btn:disabled{opacity:.55;cursor:default}
.appactions{display:flex;gap:6px;flex-wrap:wrap}
.appactions .btn.on{border-color:var(--accent);color:var(--accent)}
.art{margin-top:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);height:150px;position:relative;overflow:hidden;font-size:11px}
.art .bar{display:flex;align-items:center;gap:5px;padding:7px 10px;border-bottom:1px solid var(--line);color:var(--faint);font-family:var(--f-mono)}
.art .bar i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.art .bar span{margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art .b{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:5px 9px;color:var(--muted);height:22px;max-width:75%;font-size:11px;overflow:hidden;white-space:nowrap}
.art .b.r{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:transparent;width:60%;align-self:flex-start}
.art .b.s{width:38%}
.art.win .body{display:flex;height:calc(100% - 30px)}
.art.win .side{width:26%;border-right:1px solid var(--line);background:var(--panel)}
.art.win .main{flex:1;display:flex;flex-direction:column;gap:8px;padding:10px;align-items:flex-end}
.art.win .main .b{width:55%}
.art.win .input{margin-top:auto;align-self:stretch;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--faint);display:flex;gap:4px;align-items:center}
.art kbd{font:10px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted);background:var(--raise)}
.art.phone{width:150px;margin-left:auto;margin-right:auto;border-radius:22px 22px 0 0;border-bottom:0;display:flex;flex-direction:column;gap:7px;padding:22px 10px 10px;align-items:flex-end;height:170px;margin-bottom:-20px}
.art.phone .notch{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:44px;height:6px;border-radius:4px;background:var(--line)}
.art.phone .b{max-width:90%;white-space:normal;height:auto}
.art.phone .mic{width:26px;height:26px;border-radius:50%;background:var(--accent);margin-top:auto;align-self:center;opacity:.8}
.art.editor{display:flex}
.art.editor .code{flex:1;padding:12px;display:flex;flex-direction:column;gap:7px}
.art.editor .code span{display:block;height:7px;border-radius:4px;background:var(--line)}
.art.editor .panel,.art.browser .panel{width:42%;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:7px;padding:10px;align-items:flex-end}
.art.editor .panel .b,.art.browser .panel .b{max-width:100%;font-family:var(--f-mono)}
.art.browser .body{display:flex;height:calc(100% - 30px)}
.art.browser .page{flex:1;padding:12px;display:flex;flex-direction:column;gap:8px}
.art.browser .page span{height:9px;border-radius:4px;background:var(--line)}
.art.browser .page .s{width:50%}
.art.discord{padding:12px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,#5865f2 6%,var(--bg))}
.art.discord .m{display:flex;gap:9px}
.art.discord .av{width:26px;height:26px;border-radius:50%;background:var(--line);flex:none}
.art.discord .av.a{background:var(--accent)}
.art.discord b{font-size:12px;font-weight:600}
.art.discord em{font-style:normal;font-size:9px;background:#5865f2;color:#fff;border-radius:3px;padding:0 3px;margin-left:4px}
.art.discord p{margin:2px 0 0;color:var(--muted);font-size:12px}
.art.game{background:linear-gradient(160deg,#2b3a2f,#1b2230 60%,#3a2a24);border-color:transparent}
.art.game .chat{position:absolute;left:12px;top:14px;right:30%;display:flex;flex-direction:column;gap:5px;font:11.5px var(--f-mono);color:#e8e8e8;text-shadow:0 1px 2px #000}
.art.game .chat p{margin:0;background:rgba(0,0,0,.35);padding:3px 7px;border-radius:4px}
.art.game .chat b{color:#ffb35c}.art.game .chat .a b{color:#7cc4b8}
@media (max-width:820px){.apps-grid{grid-template-columns:1fr}.apps{padding:18px;margin:8px auto}}

/* Versions de modèles */
.vgroup .chev{width:15px;height:15px;color:var(--faint);transition:transform .15s}
.vgroup.open .chev{transform:rotate(180deg)}
.vlist{display:none;flex-direction:column;gap:1px;margin:0 0 6px 38px;border-left:1px solid var(--line);padding-left:8px}
.vgroup.open .vlist{display:flex}
.vrow{display:flex;align-items:baseline;gap:10px;text-align:left;padding:6px 8px;border-radius:7px;font-size:13.5px}
.vrow:hover{background:var(--panel)}
.vrow.sel{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.vrow b{font-weight:500;white-space:nowrap}
.vrow small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow.more{color:var(--accent);font-size:12.5px}
.tier.abonnement{color:#8fa8ff;border-color:color-mix(in srgb,#8fa8ff 45%,transparent)}

/* Fenêtre de connexion */
.auth{background:var(--raise);border:1px solid var(--line);border-radius:18px;width:min(420px,100%);padding:26px 24px 22px;display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto;position:relative}
.auth .x{position:absolute;top:12px;right:12px}
.auth-top{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.auth-top h2{font:400 26px/1.15 var(--f-display);margin:0;letter-spacing:-.01em}
.auth-top p{margin:0;color:var(--muted);font-size:13.5px}
.auth .tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:10px;padding:3px}
.auth .tabs2 button{padding:7px;border-radius:8px;font-size:13.5px;color:var(--muted)}
.auth .tabs2 button.on{background:var(--raise);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.auth .sso{grid-template-columns:1fr}
.auth .sso button{justify-content:center;padding:9px 14px}
.auth-sep{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px}
.auth-sep::before,.auth-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.auth label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.auth input[type=text],.auth input[type=email],.auth input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;font-size:14.5px;width:100%}
.auth input:focus{border-color:var(--accent)}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--faint);padding:4px 6px}
.auth .go{padding:11px;font-size:15px;font-weight:500}
.auth .link{color:var(--accent);font-size:13px;align-self:flex-start;padding:0}
.auth .msg{font-size:13px;border-radius:10px;padding:9px 12px}
.auth .msg.err{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.auth .msg.ok{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.auth small.legal{color:var(--faint);font-size:11.5px;text-align:center;line-height:1.45}
.strength{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:2px}
.strength i{display:block;height:100%;width:0;transition:width .2s,background .2s}

.logo{overflow:hidden}
.logo .bimg{width:58%;height:58%;object-fit:contain;filter:brightness(0) invert(1);display:block}
.logo .bimg.own{width:100%;height:100%;filter:none}
.grp .logo{border-radius:5px;flex:none}
.urow .logo{border-radius:6px;flex:none}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:13.5px;z-index:60;max-width:calc(100vw - 32px)}

@media (max-width:760px){
  aside{position:fixed;inset:0 auto 0 0;z-index:40;height:100%;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .modes-grid,.form{grid-template-columns:1fr}
  .msg.user{max-width:92%}
  .modal{flex-direction:column;height:92vh}
  .mnav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;align-items:center}
  .mnav h2{display:none}
  .mnav button{white-space:nowrap}
  .mnav .close{margin-top:0;margin-left:auto}
  .mbody{padding:18px 16px}
  .urow{grid-template-columns:1fr auto}
  .urow .bar{grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function docSources(pr){
  if (!pr) return [];
  const d = DOCS[pr.platform] || { base:[], fw:{} };
  const fwKeys = (pr.framework || '').toLowerCase().split(/[,+]/).map(s => s.trim().replace(/\s+/g, ''));
  const out = [...d.base];
  for (const k of fwKeys){ const hit = d.fw[k] || Object.entries(d.fw).find(([n]) => k && (n.includes(k) || k.includes(n)))?.[1]; if (hit) out.push(...hit) }
  for (const u of (pr.extraDocs || '').split(/\s+/)) if (/^https?:\/\//.test(u)) out.push([u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 40), u]);
  const seen = new Set(); return out.filter(([, u]) => !seen.has(u) && seen.add(u));
}

const ORB_LABELS = { working:'Réfléchit', searching:'Cherche', solving:'Raisonne', listening:'Écoute', connecting:'Connexion', weaving:'Code', composing:'Écrit', breathing:'Prêt', shaping:'Dessine' };
const orbs = new Set(); let orbLoop = 0;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const darkMq = matchMedia('(prefers-color-scheme: dark)');
let orbTint = null;
function readTint(){
  const v = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const m = v.match(/^#([0-9a-f]{6})$/i);
  orbTint = m ? { r:parseInt(m[1].slice(0,2),16), g:parseInt(m[1].slice(2,4),16), b:parseInt(m[1].slice(4,6),16) } : null;
}
darkMq.addEventListener('change', () => { if (design.theme === 'system') applyDesign() });
function makeOrb(state, size = 20, cssSize){
  const c = document.createElement('canvas'); c.className = 'orb'; c.setAttribute('role','img');
  const px = cssSize || size; c.style.width = c.style.height = px + 'px';
  const dpr = Math.min(2, devicePixelRatio || 1); c.width = c.height = Math.round(px * dpr);
  const o = { c, size, px, dpr, ctx:c.getContext('2d'), paused:false };
  o.set = s => { if (o.state === s) return; o.state = s; c.setAttribute('aria-label', ORB_LABELS[s] || s);
    if (!window.OrbEngine) return; const r = OrbEngine.resolvePreset(s, size); o.mode = r.mode; o.speed = r.speed; o.opts = r.opts; drawOrb(o, performance.now()/1000*o.speed) };
  o.pause = () => { o.paused = true; drawOrb(o, .6) };
  o.play = () => { o.paused = false; startOrbs() };
  o.set(state); orbs.add(o); startOrbs();
  return o;
}
function drawOrb(o, t){
  if (!window.OrbEngine || !o.mode) return;
  const k = o.px / o.size;
  o.ctx.setTransform(o.dpr*k, 0, 0, o.dpr*k, 0, 0); o.ctx.clearRect(0, 0, o.size, o.size);
  OrbEngine.paintFrame(o.ctx, OrbEngine.MODE_FRAMES[o.mode](o.size, t, o.opts), isDarkNow(), orbTint || undefined);
}
function startOrbs(){
  if (orbLoop) return;
  const tick = () => {
    let any = false; const now = performance.now()/1000;
    for (const o of orbs){
      if (!o.c.isConnected){ if (o.seen) orbs.delete(o); continue }
      o.seen = true;
      if (o.paused || reducedMotion.matches){ continue }
      any = true; drawOrb(o, now * o.speed);
    }
    orbLoop = (any || [...orbs].some(o => !o.seen)) && !document.hidden ? requestAnimationFrame(tick) : 0;
  };
  orbLoop = requestAnimationFrame(tick);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) startOrbs() });

// OpenRouter : vraie connexion OAuth (PKCE), sans copier de clé
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function openRouterLogin(){
  if (!/^https?:/.test(location.protocol) || !crypto.subtle){ toast('La connexion 1 clic demande que le site soit ouvert via http(s) (ex. localhost). Colle ta clé à la place.'); return false }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  store.set('orVerifier', verifier);
  location.href = 'https://openrouter.ai/auth?callback_url=' + encodeURIComponent(location.origin + location.pathname) + '&code_challenge=' + challenge + '&code_challenge_method=S256';
  return true;
}
async function finishOpenRouterLogin(){
  const code = new URLSearchParams(location.search).get('code');
  const verifier = store.get('orVerifier', null);
  if (!code || !verifier) return;
  history.replaceState(null, '', location.pathname);
  try{
    const r = await fetch('https://openrouter.ai/api/v1/auth/keys', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code, code_verifier: verifier, code_challenge_method:'S256' }) });
    const j = await r.json(); if (!j.key) throw new Error(j.error?.message || 'réponse invalide');
    const n = await linkKey(prov('openrouter'), j.key);
    current = { provider:'openrouter', model: modelCache.openrouter?.[0] || current.model }; store.set('current', current); renderModelLbl();
    toast(`OpenRouter lié · ${n} modèles gratuits`);
  }catch(e){ toast('Connexion OpenRouter échouée : ' + e.message) }
  store.set('orVerifier', null);
}

function addUsage(pid, model, inp, out, estimated){
  const d = today();
  const day = usage.days[d] ||= {};
  const pv = day[pid] ||= {};
  const m = pv[model] ||= { in:0, out:0, req:0, est:0 };
  m.in += inp; m.out += out; m.req += 1; if (estimated) m.est += 1;
  store.set('usage', usage); renderSideMeta();
}
function aggregate(range){
  const now = new Date(); const out = {}; let tin = 0, tout = 0, req = 0;
  for (const [d, day] of Object.entries(usage.days)){
    const age = (now - new Date(d + 'T12:00:00')) / 864e5;
    if (range === 'today' && d !== today()) continue;
    if (range === '7d' && age > 7) continue;
    for (const [pid, models] of Object.entries(day)){
      const P = out[pid] ||= { in:0, out:0, req:0, models:{} };
      for (const [mid, v] of Object.entries(models)){
        P.in += v.in; P.out += v.out; P.req += v.req; tin += v.in; tout += v.out; req += v.req;
        const M = P.models[mid] ||= { in:0, out:0, req:0 }; M.in += v.in; M.out += v.out; M.req += v.req;
      }
    }
  }
  return { per: out, tin, tout, req };
}

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function keywords(text){
  const ids = (text.match(/[A-Za-z_][A-Za-z0-9_:.]{2,}/g) || []).flatMap(w => [w, ...w.split(/(?=[A-Z])|[_:.]/)]);
  const words = norm(text).split(/[^a-z0-9_]+/).concat(ids.map(norm));
  return [...new Set(words.filter(w => w.length >= 3 && !STOP.has(w) && !/^\d+$/.test(w)))].slice(0, 25);

function saveDocCache(){
  for (let i = 0; i < 6; i++){
    try{ localStorage.setItem(LS + '.docs', JSON.stringify(docCache)); return }
    catch{ const old = Object.entries(docCache).sort((a, b) => a[1].ts - b[1].ts).slice(0, 4); if (!old.length) return; old.forEach(([u]) => delete docCache[u]) }
  }
}
async function readDoc(url){
  const hit = docCache[url];
  if (hit && Date.now() - hit.ts < 7 * 864e5) return hit;
  const tryFetch = async u => { const h = {}; if (u.startsWith(settings.docReader) && settings.jinaKey) h.Authorization = 'Bearer ' + settings.jinaKey;
    const r = await fetch(u, { headers:h, signal: AbortSignal.timeout(12000) }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.text() };
  let text;
  try{ text = await tryFetch(settings.docReader + url) }
  catch(e){ try{ text = await tryFetch(url) }catch{ docCache[url] = { ts:Date.now(), err:e.message, text:'', links:[] }; saveDocCache(); throw e } }
  let host = ''; try{ host = new URL(url).host }catch{}
  const links = [];
  for (const m of text.matchAll(/\[([^\]\n]{2,90})\]\((https?:\/\/[^)\s]+)\)/g)){
    try{ const u = new URL(m[2]); if (u.host === host && !/\.(png|jpe?g|svg|gif|webp|ico)$/i.test(u.pathname)) links.push({ t:m[1].replace(/[*_`]/g, ''), u:u.origin + u.pathname }) }catch{}
  }
  const uniq = [...new Map(links.map(l => [l.u, l])).values()].slice(0, 400);
  const title = (text.match(/^Title:\s*(.+)$/m) || [])[1] || url;
  const body = text.replace(/^Title:.*\n|^URL Source:.*\n|^Markdown Content:\n/gm, '').replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\n{3,}/g, '\n\n').slice(0, 24000);
  docCache[url] = { ts:Date.now(), title, text:body, links:uniq }; saveDocCache();
  return docCache[url];
}
function chunks(text){
  const out = []; let cur = '';
  for (const part of text.split(/\n(?=#{1,4} )|\n\n/)){
    if ((cur + part).length > 1100 && cur){ out.push(cur); cur = '' }
    cur += (cur ? '\n\n' : '') + part;
  }
  if (cur) out.push(cur);
  return out.map(c => c.slice(0, 1600));
}
function scoreText(t, kws){
  const s = norm(t); let sc = 0;
  for (const k of kws){ let i = -1, n = 0; while ((i = s.indexOf(k, i + 1)) !== -1 && n < 3) n++; sc += n * (k.length > 6 ? 2 : 1) }
  return sc + (/```|\bfunction\b|local |=>|\(\)/.test(t) && sc ? 1 : 0);
}
async function gatherDocs(query, onPhase){
  const pr = project();
  const urlsInMsg = (query.match(/https?:\/\/[^\s)>\]]+/g) || []).slice(0, 2);
  const useProj = coding && pr && pr.docsAuto !== false;
  const sources = useProj ? docSources(pr) : [];
  if (!sources.length && !urlsInMsg.length) return { ctx:'', used:[] };
  onPhase?.();
  const kws = keywords(query);
  const pages = [];
  // 1) pages collées dans le message
  await Promise.all(urlsInMsg.map(async u => { try{ const d = await readDoc(u); if (d.text) pages.push({ title:d.title, url:u, text:d.text, forced:true }) }catch{} }));
  // 2) index de la plateforme/framework + sous-pages dont le lien colle aux mots-clés
  if (sources.length && kws.length){
    const idx = await Promise.all(sources.map(async ([t, u]) => { try{ return { t, u, d: await readDoc(u) } }catch{ return null } }));
    const cand = [];
    for (const s of idx.filter(Boolean)){
      if (s.d.text) pages.push({ title:s.t, url:s.u, text:s.d.text });
      for (const l of s.d.links){ const sc = scoreText(l.t + ' ' + l.u.split('/').slice(3).join(' ').replace(/[-_]/g, ' '), kws); if (sc >= 2) cand.push({ ...l, sc, src:s.t }) }
    }
    cand.sort((a, b) => b.sc - a.sc);
    const pick = [...new Map(cand.map(c => [c.u, c])).values()].slice(0, 3);
    await Promise.all(pick.map(async c => { try{ const d = await readDoc(c.u); if (d.text) pages.push({ title:`${c.src} · ${c.t}`, url:c.u, text:d.text }) }catch{} }));
  }
  // 3) meilleurs extraits
  const scored = [];
  for (const p of pages){
    const cs = chunks(p.text);
    cs.forEach((c, i) => { const sc = scoreText(c, kws) + (p.forced && i < 3 ? 5 : 0); if (sc > 0) scored.push({ p, c, sc }) });
  }
  scored.sort((a, b) => b.sc - a.sc);
  let total = 0; const keep = [];
  for (const s of scored){ if (total + s.c.length > 6500) continue; keep.push(s); total += s.c.length; if (keep.length >= 6) break }
  if (!keep.length) return { ctx:'', used:[] };
  const used = [...new Map(keep.map(k => [k.p.url, { title:k.p.title, url:k.p.url }])).values()];
  const ctx = 'DOCUMENTATION OFFICIELLE trouvée pour cette demande. Base-toi dessus en priorité (noms de fonctions, signatures, exports, événements). Si elle contredit tes connaissances, c\'est elle qui a raison. Cite le lien quand c\'est utile.\n\n'
    + keep.map(k => `--- ${k.p.title} (${k.p.url})\n${k.c}`).join('\n\n');
  return { ctx, used };
}

const GH = 'https://api.github.com';
const GH_TOKEN_URL = 'https://github.com/settings/tokens/new?scopes=repo&description=Agora%20(chat%20multi-IA)';
const ghUser = () => store.get('ghUser', null);
async function gh(path, opts = {}){
  const r = await fetch(GH + path, { ...opts, headers:{ Accept:'application/vnd.github+json', Authorization:'Bearer ' + keys.github, ...(opts.body ? { 'Content-Type':'application/json' } : {}) } });
  if (!r.ok){ let m = 'GitHub ' + r.status; try{ const j = await r.json(); m += ' : ' + j.message }catch{} throw Object.assign(new Error(m), { status:r.status }) }
  return r.status === 204 ? null : r.json();
}
async function linkGitHub(token){
  const prev = keys.github; keys.github = token.trim();
  try{ const u = await gh('/user'); store.set('ghUser', { login:u.login, avatar:u.avatar_url }); store.set('keys', keys); renderSideMeta(); return u }
  catch(e){ if (prev) keys.github = prev; else delete keys.github; throw e }
}
function unlinkGitHub(){ delete keys.github; store.set('keys', keys); store.set('ghUser', null) }
const ghReady = pr => !!(keys.github && pr?.repo && pr?.branch);
const slug = s => norm(s || 'projet').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) || 'projet';
const readBranch = pr => pr.workBranch || pr.branch;
const treeCache = {};
async function repoTree(pr){
  const k = pr.repo + '@' + readBranch(pr);
  if (treeCache[k] && Date.now() - treeCache[k].ts < 3e5) return treeCache[k].paths;
  let t;
  try{ t = await gh(`/repos/${pr.repo}/git/trees/${encodeURIComponent(readBranch(pr))}?recursive=1`) }
  catch(e){ if (e.status === 404 && pr.workBranch){ pr.workBranch = null; return repoTree(pr) } throw e }
  const paths = t.tree.filter(x => x.type === 'blob').map(x => x.path)
    .filter(p => !/(^|\/)(node_modules|\.git|dist|build|vendor|\.next)\//.test(p) && !/\.(png|jpe?g|gif|webp|ico|ttf|otf|woff2?|mp3|ogg|wav|mp4|webm|zip|rar|7z|ytd|yft|ydr|ytyp|ymap|ybn|ycd|dds|rpf|exe|dll|so|psd|blend|fbx)$/i.test(p));
  treeCache[k] = { ts:Date.now(), paths };
  return paths;
}
async function readRepoFile(pr, path){
  const j = await gh(`/repos/${pr.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(readBranch(pr))}`);
  if (Array.isArray(j)) return '(dossier) ' + j.map(x => x.name).join(', ');
  if (j.size > 200000) return '(fichier trop gros pour être lu : ' + Math.round(j.size / 1024) + ' Ko)';
  const bin = atob((j.content || '').replace(/\n/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
async function repoContext(pr){
  if (!coding || !ghReady(pr)) return '';
  try{
    const paths = await repoTree(pr);
    const list = paths.slice(0, 350).join('\n') + (paths.length > 350 ? `\n… (+${paths.length - 350} fichiers)` : '');
    return `DÉPÔT GITHUB connecté : ${pr.repo} (branche ${readBranch(pr)}). Arborescence :\n${list}\n\nPour LIRE un fichier existant avant de le modifier, écris sur une ligne seule [[LIRE: chemin/exact]] (plusieurs lignes possibles), puis arrête ta réponse : Agora te renverra leur contenu et tu continueras. Lis toujours un fichier avant de le modifier. Quand tu crées ou modifies un fichier, écris son chemin exact sur la ligne juste avant le bloc de code et donne son contenu COMPLET.`;
  }catch(e){ return '' }
}
const committable = fs => fs.filter(f => !/^fichier-\d+/.test(f.name) && /\.[A-Za-z0-9]{1,8}$/.test(f.name) && !f.name.startsWith('/') && f.code.trim());
async function commitFiles(pr, files, message){
  const repo = pr.repo, base = pr.branch;
  const target = pr.useBranch === false ? base : (pr.workBranch || `agora/${slug(pr.name)}`);
  let head;
  try{ head = (await gh(`/repos/${repo}/git/ref/heads/${target}`)).object.sha }
  catch(e){
    if (e.status !== 404) throw e;
    const baseSha = (await gh(`/repos/${repo}/git/ref/heads/${base}`)).object.sha;
    await gh(`/repos/${repo}/git/refs`, { method:'POST', body: JSON.stringify({ ref:'refs/heads/' + target, sha:baseSha }) });
    head = baseSha;
  }
  const parent = await gh(`/repos/${repo}/git/commits/${head}`);
  const tree = await gh(`/repos/${repo}/git/trees`, { method:'POST', body: JSON.stringify({ base_tree: parent.tree.sha, tree: files.map(f => ({ path: f.name, mode:'100644', type:'blob', content: f.code.endsWith('\n') ? f.code : f.code + '\n' })) }) });
  const c = await gh(`/repos/${repo}/git/commits`, { method:'POST', body: JSON.stringify({ message, tree: tree.sha, parents:[head] }) });
  await gh(`/repos/${repo}/git/refs/heads/${target}`, { method:'PATCH', body: JSON.stringify({ sha: c.sha }) });
  Object.keys(treeCache).forEach(k => delete treeCache[k]);
  if (target !== base){ pr.workBranch = target; store.set('projects', projects) }
  return { branch: target, sha: c.sha, url: `https://github.com/${repo}/commit/${c.sha}`, isBase: target === base };
}
async function openPR(pr, branch, title){
  try{ return (await gh(`/repos/${pr.repo}/pulls`, { method:'POST', body: JSON.stringify({ title, head: branch, base: pr.branch, body:'Modifications proposées depuis Agora.' }) })).html_url }
  catch(e){

async function runAgentTask(c, el, ai, idx){
  const p = prov(current.provider), pr = project();

  const fail = msg => { ai.error = msg; c.messages.push(ai); saveConvs(); updateAi(el, ai, c.messages.length - 1, false) };
  if (!hasAccess(p)) return fail(p.id === 'copilot' ? 'Lie d\'abord GitHub dans « Comptes IA » (Copilot utilise ce compte).' : 'Lie ta clé Cursor dans « Comptes IA ».');
  if (!pr?.repo) return fail(`${p.name} travaille sur un dépôt GitHub. Choisis-en un dans « Mes projets » (section Dépôt GitHub).`);
  const req = [...c.messages].reverse().find(m => m.role === 'user' && !m.hidden);
  const task = [req?.display || req?.content || '', pr.notes ? `\n\nContexte du projet (${platform(pr.platform)?.name || ''}${pr.framework ? ', ' + pr.framework : ''}) : ${pr.notes}` : ''].join('');

  if (!ok){ abortCtl = null; setBusy(false); return fail('Tâche annulée.') }

  const status = t => { lines.push(t); ai.content = lines.map(l => '- ' + l).join('\n'); updateAi(el, ai, idx, true, 'write') };
  try{
    let get, link = null, label = '';
    if (p.id === 'copilot'){
      const t = await gh(`/agents/repos/${pr.repo}/tasks`, { method:'POST', body: JSON.stringify({ prompt: task, base_ref: pr.branch, create_pull_request: true }) });
      const id = t.id || t.task_id; status(`Tâche créée chez Copilot (${t.state || 'en file d\'attente'})`);
      get = async () => { const x = await gh(`/agents/repos/${pr.repo}/tasks/${id}`); return { st: x.state, done: ['completed','failed','idle','waiting_for_user','timed_out','cancelled'].includes(x.state), okEnd: ['completed','idle','waiting_for_user'].includes(x.state), pr: findPr(x), raw:x } };
      link = `https://github.com/${pr.repo}/pulls`; label = 'Pull requests du dépôt';
    } else {

      status(`Agent Cursor lancé (${a.status || 'création'})`);
      link = a.target?.url || null; label = 'Suivre sur Cursor';
      get = async () => { const x = await cursorApi(`/v0/agents/${a.id}`); return { st: x.status, done: ['FINISHED','ERROR','EXPIRED','CANCELLED'].includes(x.status), okEnd: x.status === 'FINISHED', pr: x.target?.prUrl || findPr(x), summary: x.summary, url: x.target?.url, raw:x } };
    }
    let last = '', res, t0 = Date.now();
    while (!abortCtl.signal.aborted && Date.now() - t0 < 45 * 60e3){
      await sleep(8000); if (abortCtl.signal.aborted) break;
      try{ res = await get() }catch(e){ status('Lecture de l\'état impossible : ' + e.message); continue }
      if (res.url) link = res.url;
      if (res.st !== last){ last = res.st; status(`${p.name} : ${({ queued:'en file d\'attente', in_progress:'au travail', completed:'terminé', failed:'échec', CREATING:'préparation', RUNNING:'au travail', FINISHED:'terminé', ERROR:'échec' })[res.st] || res.st}`) }
      if (res.done) break;
    }
    if (abortCtl.signal.aborted){ status('Suivi arrêté ici. La tâche continue de son côté.'); }
    else if (res?.done && res.okEnd){ status('Travail terminé.' + (res.summary ? '\n\n' + res.summary : '')) }
    else if (res?.done) status('La tâche s\'est arrêtée sans aboutir.');
    else status('Toujours en cours après 45 minutes. Suis la suite via le lien.');
    (ai.log ||= []);
    if (res?.pr) ai.log.push({ t:'Pull request', u:res.pr });
    if (link) ai.log.push({ t:label, u:link });
  }catch(e){
    ai.error = e instanceof TypeError ? `Impossible de joindre ${p.name} depuis le navigateur (réseau ou accès bloqué).` : e.message + (e.status === 403 || e.status === 404 ? (p.id === 'copilot' ? ' · Vérifie que ton abonnement Copilot inclut l\'agent et que ton jeton GitHub a l\'accès « repo ».' : ' · Vérifie ta clé Cursor et l\'accès de Cursor à ce dépôt GitHub.') : '');
  }
  c.messages.push(ai); saveConvs(); abortCtl = null; setBusy(false);
  updateAi(el, ai, c.messages.length - 1, false); updateComposer();
}

async function streamOnce(p, model, sys, msgs, onPhase, ai){
  const isA = p.kind === 'anthropic';
  const headers = { 'Content-Type':'application/json', ...authHeaders(p) };
  if (p.id === 'openrouter'){ headers['X-Title'] = 'Agora' }
  let body;
  if (isA){
    const merged = [];
    const parts = c => typeof c === 'string' ? [{ type:'text', text:c }] : c.map(x => {
      if (x.type !== 'image_url') return { type:'text', text:x.text || '' };
      const mm = x.image_url.url.match(/^data:(image\/[\w+.-]+);base64,(.+)$/);
      return mm ? { type:'image', source:{ type:'base64', media_type:mm[1], data:mm[2] } } : { type:'image', source:{ type:'url', url:x.image_url.url } };
    });
    for (const m of msgs){ const last = merged.at(-1);
      if (last && last.role === m.role){ if (typeof last.content === 'string' && typeof m.content === 'string') last.content += '\n\n' + m.content; else last.content = [...parts(last.content), ...parts(m.content)] }
      else merged.push({ ...m }) }
    while (merged[0]?.role === 'assistant') merged.shift();
    body = { model, max_tokens: +settings.maxTokens || 4096, stream:true, messages: merged, temperature: Math.min(1, +settings.temperature) };
    if (sys) body.system = sys;
  } else {
    body = { model, stream:true, temperature: +settings.temperature, messages: (sys ? [{ role:'system', content:sys }] : []).concat(msgs) };
    if (p.usage) body.stream_options = { include_usage:true };
  }
  const r = await fetch(p.chat, { method:'POST', headers, body: JSON.stringify(body), signal: abortCtl.signal });
  if (!r.ok){
    let msg = `${p.name} : erreur ${r.status}`;
    try{ const j = await r.json(); msg += ' — ' + String(j.error?.message || j.message || JSON.stringify(j)).slice(0, 240) }catch{}
    if (r.status === 401 || r.status === 403) msg += '. Vérifie que ton compte est bien lié.';
    if (r.status === 429) msg += '. Limite gratuite atteinte.';
    if (r.status === 402) msg += '. Crédits insuffisants sur ce compte.';
    throw Object.assign(new Error(msg), { retry: r.status === 429 || r.status >= 500 || r.status === 402 });
  }
  let usageOut = null;
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('event-stream')){
    const raw = await r.text();
    try{ const j = JSON.parse(raw);
      if (isA){ ai.content = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join(''); if (j.usage) usageOut = { in:j.usage.input_tokens, out:j.usage.output_tokens } }
      else { ai.content = j.choices?.[0]?.message?.content || ''; ai.reasoning = j.choices?.[0]?.message?.reasoning || ''; if (j.usage) usageOut = { in:j.usage.prompt_tokens, out:j.usage.completion_tokens } }
    }catch{ ai.content = raw }
    return usageOut;
  }
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
  const aUse = { in:0, out:0 };
  while (true){
    const { done, value } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream:true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines){
      const t = line.trim(); if (!t.startsWith('data:')) continue;
      const data = t.slice(5).trim(); if (!data || data === '[DONE]') continue;
      let j; try{ j = JSON.parse(data) }catch{ continue }
      if (j.error) throw Object.assign(new Error(`${p.name} : ` + (j.error.message || 'erreur')), { retry:true });
      if (isA){
        if (j.type === 'message_start' && j.message?.usage){ aUse.in = j.message.usage.input_tokens || 0; aUse.out = j.message.usage.output_tokens || 0 }
        if (j.type === 'content_block_delta'){ if (j.delta.type === 'text_delta') ai.content += j.delta.text; if (j.delta.type === 'thinking_delta') ai.reasoning += j.delta.thinking }
        if (j.type === 'message_delta' && j.usage){ aUse.out = j.usage.output_tokens || aUse.out; usageOut = aUse }
      } else {
        const dl = j.choices?.[0]?.delta || {};
        if (dl.content) ai.content += dl.content;
        if (dl.reasoning) ai.reasoning += dl.reasoning;
        if (dl.reasoning_content) ai.reasoning += dl.reasoning_content;
        if (j.usage && (j.usage.prompt_tokens || j.usage.completion_tokens)) usageOut = { in:j.usage.prompt_tokens || 0, out:j.usage.completion_tokens || 0 };
      }
    }
    const { body: b } = splitThink(ai.content);
    onPhase(b ? 'write' : (ai.reasoning || ai.content.includes('<think>')) ? 'think' : 'wait');
  }
  return usageOut;
}

  if (!window.pdfjsLib){ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'); pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js' }
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; let out = '';
  for (let i = 1; i <= Math.min(doc.numPages, 40); i++){ const pg = await doc.getPage(i); const tc = await pg.getTextContent(); out += `\n--- Page ${i} ---\n` + tc.items.map(x => x.str).join(' ') }
  return out.slice(0, 120000);
}
async function addFiles(list){
  for (const f of list){
    if (f.size > 15e6){ toast(`${f.name} est trop gros (15 Mo max)`); continue }
    try{
      if (f.type.startsWith('image/')) pending.push({ kind:'image', name:f.name || 'image.png', data: await downscale(f) });
      else if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){ toast('Lecture du PDF…'); pending.push({ kind:'text', name:f.name, text: await pdfText(f) }) }
      else if (f.type.startsWith('text/') || TEXT_EXT.test(f.name) || f.type === 'application/json') pending.push({ kind:'text', name:f.name, text:(await f.text()).slice(0, 120000) });
      else toast(`Format non pris en charge : ${f.name}`);
    }catch(e){ toast(`${f.name} : ${e.message}`) }
  }
  if (pending.some(a => a.kind === 'image') && current.provider === 'smart' && settings.expert === false) {} // le mode simple bascule tout seul sur une IA « Images »
  renderAttach(); updateComposer();
}
function renderAttach(){
  const row = $('#attachRow'); row.innerHTML = '';
  pending.forEach((a, i) => {
    const c2 = document.createElement('span'); c2.className = 'achip big';
    c2.innerHTML = (a.kind === 'image' ? `<img src="${a.data}" alt="">` : '<svg class="icon" style="width:15px;height:15px"><use href="#i-clip"/></svg>') + `<span>${esc(a.name)}</span><button title="Retirer">×</button>`;
    c2.querySelector('button').onclick = () => { pending.splice(i, 1); renderAttach(); updateComposer() };

   ANALYSEUR DE LOGS FIVEM
   ===================================================================== */
function looksLikeFiveMLog(t){ return t && t.split('\n').length > 2 && /SCRIPT ERROR|\[\s*script:|citizen:\/|Couldn't (?:start|load) resource|Failed to (?:load|start)|\[txAdmin\]|\[\s*c-scripting|@[\w-]+\/[\w/.-]+\.lua:\d+|attempt to (?:index|call|compare|perform)/i.test(t) }
function parseFiveMLogs(t){
  const map = new Map();
  for (const l0 of t.replace(/\^\d/g, '').split('\n')){
    const l = l0.trim(); let m, key, item;
    if ((m = l.match(/SCRIPT ERROR:?\s*@?([\w-]+)\/([^:\s]+):(\d+):\s*(.+)/i) || l.match(/@([\w-]+)\/([\w/.-]+\.(?:lua|js)):(\d+):\s*(.+)/))){ key = m[1] + m[2] + m[3] + m[4].slice(0, 80); item = { res:m[1], file:m[2], line:m[3], msg:m[4], type:'erreur' } }
    else if ((m = l.match(/Couldn't (?:start|load) resource ([\w-]+)[.:]?\s*(.*)/i))){ key = 'start' + m[1]; item = { res:m[1], msg:'La ressource ne démarre pas. ' + m[2], type:'démarrage' } }
    else if ((m = l.match(/\[\s*(?:script|c-scripting-core|resources):([\w-]+)\s*\]\s*(.*(?:error|erreur|attempt to|nil value|failed|exception).*)/i))){ key = m[1] + m[2].slice(0, 80); item = { res:m[1], msg:m[2], type:'erreur' } }
    else if ((m = l.match(/(?:^|\s)(?:Warning|WARN)[:\]]\s*(.+)/i))){ key = 'w' + m[1].slice(0, 80); item = { res:'?', msg:m[1], type:'avertissement' } }
    if (!item) continue;
    const e = map.get(key); if (e) e.count++; else map.set(key, { ...item, msg:item.msg.trim(), count:1 });
  }
  return [...map.values()].sort((a, b) => (a.type === 'avertissement') - (b.type === 'avertissement') || b.count - a.count);
}
function logsSummary(t){
  const list = parseFiveMLogs(t); if (!list.length) return '';
  return `Résumé automatique (${list.length} problème${list.length > 1 ? 's' : ''} distinct${list.length > 1 ? 's' : ''}) :\n` + list.slice(0, 40).map(e => `- [${e.type}] ${e.res}${e.file ? ` · ${e.file}:${e.line}` : ''} · ×${e.count} · ${e.msg.slice(0, 220)}`).join('\n');
}
function checkLogs(){
  const bar = $('#logBar'); if (!bar) return;
  const txt = input.value + '\n' + pending.filter(a => a.kind === 'text').map(a => a.text).join('\n');
  const show = !input.value.startsWith('/logs') && !codesOff.has('logs') && looksLikeFiveMLog(txt);
  bar.hidden = !show;
}

async function generateCompare(c){
  renderMessages();
  const el = document.createElement('div'); el.className = 'msg ai'; $('#messages').append(el);
  const cols = compareSel.map(k => { const [pid, ...r] = k.split('|'); return { p:pid, model:r.join('|') } }).filter(x => hasAccess(prov(x.p))).slice(0, 3)
    .map(x => ({ ...x, name: prov(x.p).name + (x.p === 'pollinations' ? '' : ' · ' + shortModel(x.p, x.model)), content:'', reasoning:'' }));
  const ai = { role:'assistant', compare: cols, content:'', model:'Comparaison', kept:null };
  buildAi(el, ai);
  const idx = c.messages.length;
  abortCtl = new AbortController(); setBusy(true);
  updateAi(el, ai, idx, true, 'wait');
  const sys = buildSystem(); const { msgs } = rtkCompress(apiMessages(c));
  await Promise.all(cols.map(async col => {
    const p = prov(col.p);
    try{
      const u = await streamOnce(p, col.model, sys, msgs, () => updateAiThrottled(el, ai, idx, 'write'), col);
      const inp = u?.in ?? estTok(sys + msgs.map(m => textOf(m.content)).join('')), out = u?.out ?? estTok(col.content + col.reasoning);
      col.usage = { in:inp, out, est:!u }; addUsage(p.id, col.model, inp, out, !u);
      if (!col.content) col.error = 'Réponse vide.';
    }catch(e){ col.error = e.name === 'AbortError' ? 'Arrêté.' : (e instanceof TypeError ? `Connexion à ${p.name} impossible.` : e.message) }
  }));
  const first = cols.findIndex(x => !x.error); ai.content = first >= 0 ? cols[first].content : ''; if (first < 0) ai.error = 'Aucune IA n\'a répondu.';
  c.messages.push(ai); saveConvs(); abortCtl = null; setBusy(false);
  updateAi(el, ai, c.messages.length - 1, false); updateComposer();
}
function renderCompare(d, m, i, streaming){
  const slot = d.querySelector('.bodyslot');
  if (!slot.querySelector('.cmpgrid')){ slot.innerHTML = `<div class="cmpgrid" style="--n:${m.compare.length}">${m.compare.map((_, k) => `<div class="cmpcol" data-k="${k}"><div class="cmphead"></div><div class="md"></div><div class="cmpfoot"></div></div>`).join('')}</div>` }
  m.compare.forEach((col, k) => {
    const el = slot.querySelector(`.cmpcol[data-k="${k}"]`);
    el.classList.toggle('kept', m.kept === k);
    el.querySelector('.cmphead').innerHTML = `<b>${esc(col.name)}</b>${m.kept === k ? '<span class="pill ok">gardée</span>' : ''}`;
    const body = splitThink(col.content).body;
    el.querySelector('.md').innerHTML = col.error ? `<div class="err">${esc(col.error)}</div>` : body ? mdToHtml(body) : '<span style="color:var(--faint)">…</span>';
    enhanceCode(el.querySelector('.md'), !streaming);
    const f = el.querySelector('.cmpfoot');
    f.innerHTML = streaming ? '' : `${col.usage ? `<span class="num">↓ ${fmtFull(col.usage.out)} tokens</span>` : ''}${!col.error && m.kept !== k ? '<button class="btn sm">Garder celle-ci</button>' : ''}`;
    f.querySelector('button')?.addEventListener('click', () => { m.kept = k; m.content = col.content; m.model = col.name; saveConvs(); renderCompare(d, m, i, false); toast('Réponse gardée pour la suite de la conversation') });
  });
}

const snapMsg = x => ({ content:x.content, display:x.display, cmd:x.cmd, images:x.images, attach:x.attach });
function startEdit(w, m, i){
  if (abortCtl) return;
  const val = m.cmd ? '/' + m.cmd + ' ' + (m.display || '') : (m.display ?? m.content);
  w.innerHTML = `<div class="uedit"><textarea rows="3"></textarea><div class="row"><button class="btn sm ghost" data-e="no">Annuler</button><button class="btn sm prim" data-e="ok">Envoyer</button></div></div>`;
  const ta = w.querySelector('textarea'); ta.value = val; ta.focus(); ta.style.height = Math.min(300, ta.scrollHeight + 4) + 'px';
  w.querySelector('[data-e=no]').onclick = () => renderMessages();
  w.querySelector('[data-e=ok]').onclick = () => editMessage(i, ta.value.trim());
  ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); editMessage(i, ta.value.trim()) } if (e.key === 'Escape') renderMessages() };
}
async function editMessage(i, text){
  const c = activeConv(); if (!c || abortCtl || !text) return;
  const m = c.messages[i];
  const r = parseInput(text); if (r.util){ toast('Cette commande ne peut pas remplacer un message'); return }
  if (!m.versions){ m.versions = [{ ...snapMsg(m), tail: c.messages.slice(i + 1) }]; m.v = 0 } else m.versions[m.v] = { ...snapMsg(m), tail: c.messages.slice(i + 1) };
  Object.assign(m, { content: r.content, display: r.display, cmd: r.cmd });
  m.versions.push({ ...snapMsg(m), tail: [] }); m.v = m.versions.length - 1;
  c.messages = c.messages.slice(0, i + 1); saveConvs();
  await (compareReady() ? generateCompare(c) : generate(c));
}
function switchVersion(i, k){
  const c = activeConv(); const m = c?.messages[i]; if (!m?.versions || abortCtl || k < 0 || k >= m.versions.length) return;
  m.versions[m.v] = { ...snapMsg(m), tail: c.messages.slice(i + 1) };
  const v = m.versions[k]; Object.assign(m, snapMsg(v)); m.v = k;
  c.messages = c.messages.slice(0, i + 1).concat(v.tail || []); saveConvs(); renderMessages();
}

function drawModels(){

    b.onclick = () => { current = { provider:'auto', model:'auto' }; store.set('current', current); renderModelLbl(); closePop() };
    box.append(b); count++;
  }
  const order = [...PROVIDERS].sort((a, b) => (hasAccess(b) ? 1 : 0) - (hasAccess(a) ? 1 : 0));
  for (const p of order){
    if (freeOnly && p.tier !== 'gratuit') continue;
    const list = modelsOf(p).filter(id => (catSel === 'Tous' || categorize(id) === catSel) && (!q || id.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)));

    for (const id of list.slice(0, 80)){

        if (!hasAccess(p)){ toast(`Lie ton compte ${p.name} pour utiliser ce modèle`); openSettings('comptes', p.id) } };
      box.append(b);
    }

const isPermErr = e => e && (e.code === '42501' || /permission denied|not allowed|row-level security/i.test(e.message || ''));

const cloudCfg = () => { const c = window.AGORA_CLOUD?.url ? window.AGORA_CLOUD : store.get('cloudCfg', null); return c?.url && c?.anonKey ? c : null };

  try{
